<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-labelledby="title desc">
  <title id="title">Oli README lifecycle context — reviewer roadmap</title>
  <desc id="desc">Review the unchanged current positioning, the added vision and questions, and the boundary that future scope is not a shipped capability.</desc>
  <rect width="1280" height="380" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#0f172a">
    <text x="40" y="52" font-size="30" font-weight="700">README lifecycle context — reviewer roadmap</text>
    <text x="40" y="84" font-size="17" fill="#475569">Documentation only. Read left to right; existing tagline and runtime stay unchanged.</text>
    <rect x="40" y="118" width="370" height="150" rx="12" fill="#ecfdf5" stroke="#15803d" stroke-width="2"/>
    <text x="60" y="145" font-size="12" font-weight="700" fill="#15803d">VERIFIED BUILT — BASELINE</text>
    <text x="60" y="180" font-size="22" font-weight="700">1. Current positioning</text>
    <text x="60" y="211" font-size="17">Preview-first macOS cleanup</text>
    <text x="60" y="240" font-size="17">People, scripts and local agents</text>
    <path d="M415 193 H442 L432 186 M442 193 L432 200" fill="none" stroke="#64748b" stroke-width="2"/>
    <rect x="455" y="118" width="370" height="150" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
    <text x="475" y="145" font-size="12" font-weight="700" fill="#b45309">THIS PR — DOCUMENTATION DELTA</text>
    <text x="475" y="180" font-size="22" font-weight="700">2. Vision and use case</text>
    <text x="475" y="211" font-size="17">ASCII banner and lifecycle vision</text>
    <text x="475" y="240" font-size="17">Ecosystem, bottleneck and guidance</text>
    <path d="M830 193 H857 L847 186 M857 193 L847 200" fill="none" stroke="#64748b" stroke-width="2"/>
    <rect x="870" y="118" width="370" height="150" rx="12" fill="#faf5ff" stroke="#7e22ce" stroke-width="2"/>
    <text x="890" y="145" font-size="12" font-weight="700" fill="#7e22ce">DEFERRED — NOT IMPLEMENTED</text>
    <text x="890" y="180" font-size="22" font-weight="700">3. Preserve scope limits</text>
    <text x="890" y="211" font-size="17">Enterprise / pipelines / centralization</text>
    <text x="890" y="240" font-size="17">Separate architecture and safety review</text>
    <rect x="40" y="296" width="1200" height="55" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="60" y="330" font-size="17" font-weight="700">HARD BOUNDARY: no new ecosystem support, cleanup authority, runtime change, installer or release.</text>
  </g>
</svg>

<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-labelledby="title desc">
  <title id="title">Oli architecture &#x2014; review surfaces and runtime boundary</title>
  <desc id="desc">This PR changes repository surfaces. The local Go engine, clients and cleanup authorization remain unchanged.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1440" height="850" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="48" y="62" font-size="34" font-weight="700" fill="#0f172a">Oli architecture &#x2014; review surfaces and runtime boundary</text>
    <text x="48" y="98" font-size="18" font-weight="400" fill="#475569">This PR changes repository surfaces. The local Go engine, clients and cleanup authorization remain unchanged.</text>
    <text x="48" y="153" font-size="15" font-weight="700" fill="#475569">CHANGED HERE &#x2014; REPOSITORY AND REVIEW SURFACES</text>
    <g>
      <rect x="48" y="175" width="420" height="155" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
      <text x="66" y="203" font-size="12" font-weight="700" fill="#b45309">PARTIAL</text>
      <text x="66" y="235" font-size="22" font-weight="700" fill="#0f172a">Public entry points</text>
      <text x="66" y="263" font-size="17" font-weight="400" fill="#475569">README &#x2192; usage / safety / roadmap</text>
      <text x="66" y="287" font-size="17" font-weight="400" fill="#475569">Support / conduct / issue forms</text>
      <text x="66" y="311" font-size="17" font-weight="400" fill="#475569">Original social card (upload separate)</text>
    </g>
    <g>
      <rect x="510" y="175" width="420" height="155" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
      <text x="528" y="203" font-size="12" font-weight="700" fill="#b45309">PARTIAL</text>
      <text x="528" y="235" font-size="22" font-weight="700" fill="#0f172a">Review package</text>
      <text x="528" y="263" font-size="17" font-weight="400" fill="#475569">Scope document + literal verification</text>
      <text x="528" y="287" font-size="17" font-weight="400" fill="#475569">Reviewer map / sequence / architecture</text>
      <text x="528" y="311" font-size="17" font-weight="400" fill="#475569">Markdown + editable SVG + PNG</text>
    </g>
    <g>
      <rect x="972" y="175" width="420" height="155" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
      <text x="990" y="203" font-size="12" font-weight="700" fill="#b45309">PARTIAL</text>
      <text x="990" y="235" font-size="22" font-weight="700" fill="#0f172a">GitHub workflows</text>
      <text x="990" y="263" font-size="17" font-weight="400" fill="#475569">Pinned checkout/setup actions</text>
      <text x="990" y="287" font-size="17" font-weight="400" fill="#475569">Read-only CI; write-capable release job</text>
      <text x="990" y="311" font-size="17" font-weight="400" fill="#475569">Dependabot proposals; no auto-merge</text>
    </g>
    <text x="48" y="385" font-size="14" font-weight="700" fill="#475569">UNCHANGED &#x2014; LOCAL APPLICATION BOUNDARY (RUNTIME RESPONSIBILITIES, NOT A PACKAGE-IMPORT GRAPH)</text>
    <g>
      <rect x="48" y="415" width="420" height="160" rx="12" fill="#ecfdf5" stroke="#15803d" stroke-width="2"/>
      <text x="66" y="443" font-size="12" font-weight="700" fill="#15803d">BUILT</text>
      <text x="66" y="475" font-size="22" font-weight="700" fill="#0f172a">Interfaces</text>
      <text x="66" y="503" font-size="17" font-weight="400" fill="#475569">cmd/oli: CLI / JSON + composition</text>
      <text x="66" y="527" font-size="17" font-weight="400" fill="#475569">internal/cli: option validation</text>
      <text x="66" y="551" font-size="17" font-weight="400" fill="#475569">internal/dashboard: authenticated HTTP</text>
    </g>
    <g>
      <rect x="510" y="415" width="420" height="160" rx="12" fill="#ecfdf5" stroke="#15803d" stroke-width="2"/>
      <text x="528" y="443" font-size="12" font-weight="700" fill="#15803d">BUILT</text>
      <text x="528" y="475" font-size="22" font-weight="700" fill="#0f172a">Application coordination</text>
      <text x="528" y="503" font-size="17" font-weight="400" fill="#475569">internal/app: profiles / recommendations</text>
      <text x="528" y="527" font-size="17" font-weight="400" fill="#475569">DashboardService holds the scan plan</text>
      <text x="528" y="551" font-size="17" font-weight="400" fill="#475569">CLI also calls the cleanup engine</text>
    </g>
    <g>
      <rect x="972" y="415" width="420" height="160" rx="12" fill="#ecfdf5" stroke="#15803d" stroke-width="2"/>
      <text x="990" y="443" font-size="12" font-weight="700" fill="#15803d">BUILT</text>
      <text x="990" y="475" font-size="22" font-weight="700" fill="#0f172a">Filesystem engine</text>
      <text x="990" y="503" font-size="17" font-weight="400" fill="#475569">internal/cleanup: scan / explore / clean</text>
      <text x="990" y="527" font-size="17" font-weight="400" fill="#475569">Compiled roots, revalidation, os.Root</text>
      <text x="990" y="551" font-size="17" font-weight="400" fill="#475569">macOS storage; no remote service</text>
    </g>
    <path d="M 470 495 L 505 495" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 933 495 L 967 495" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <g>
      <rect x="48" y="625" width="1344" height="100" rx="12" fill="#faf5ff" stroke="#7e22ce" stroke-width="2"/>
      <text x="66" y="653" font-size="12" font-weight="700" fill="#7e22ce">DEFERRED</text>
      <text x="66" y="685" font-size="22" font-weight="700" fill="#0f172a">Future integrations are outside this PR</text>
      <text x="66" y="713" font-size="17" font-weight="400" fill="#475569">Agent lifecycle hooks, policy execution, low-space automation, package installers, Linux and native/cloud modules.</text>
    </g>
    <rect x="48" y="750" width="1344" height="82" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="68" y="780" font-size="18" font-weight="700" fill="#0f172a">TRUST BOUNDARY: clients do not supply arbitrary deletion paths.</text>
    <text x="68" y="808" font-size="17" font-weight="400" fill="#475569">No secret scan data in public docs. Main protection exists remotely; this PR neither bypasses nor creates it.</text>
  </g>
</svg>

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Build draft macOS release
    permissions:
      contents: write
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Validate release tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi

      - name: Test
        run: |
          test -z "$(gofmt -l .)"
          /bin/bash -n scripts/install.sh
          /bin/bash -n scripts/package-release.sh
          go vet ./...
          go test -race -count=1 ./...

      - name: Build archives and checksums
        run: /bin/bash scripts/package-release.sh "$GITHUB_REF_NAME" "$GITHUB_WORKSPACE/dist"

      - name: Verify packaged native installer lifecycle
        run: |
          set -euo pipefail
          case "$(uname -m)" in arm64) arch=arm64 ;; x86_64) arch=amd64 ;; *) exit 1 ;; esac
          install_root="$(mktemp -d "$HOME/.oli-release-test.XXXXXX")"
          /bin/bash dist/install.sh --version "$GITHUB_REF_NAME" --bin-dir "$install_root/bin" \
            --archive "dist/oli-$GITHUB_REF_NAME-darwin-$arch.tar.gz" --checksums dist/SHA256SUMS
          "$install_root/bin/oli" version
          "$install_root/bin/oli" help
          /bin/bash dist/install.sh update --replace --version "$GITHUB_REF_NAME" --bin-dir "$install_root/bin" \
            --archive "dist/oli-$GITHUB_REF_NAME-darwin-$arch.tar.gz" --checksums dist/SHA256SUMS
          /bin/bash dist/install.sh uninstall --bin-dir "$install_root/bin" --yes
          rmdir "$install_root/bin" "$install_root"

      - name: Create draft for publication review
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS dist/install.sh
          --verify-tag
          --draft
          --generate-notes
          --title "Oli ${GITHUB_REF_NAME}"

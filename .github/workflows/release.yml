name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing annotated vMAJOR.MINOR.PATCH tag
        required: true
        type: string
      commit:
        description: Exact reviewed 40-character source commit
        required: true
        type: string
      confirmation:
        description: Type PUBLISH to authorize this release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit authorization and an existing reviewer gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CONFIRMATION" == PUBLISH ]]
          gh api "repos/$REPO/environments/release" --jq '.protection_rules' |
            jq -e 'any(.[]; .type == "required_reviewers" and (.reviewers | length > 0) and .prevent_self_review == true)'

  release:
    needs: preflight
    name: Verify and publish authorized macOS artifacts
    environment: release
    permissions:
      contents: write
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      VERSION: ${{ inputs.version }}
      EXPECTED_COMMIT: ${{ inputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.5'
      - name: Verify source and test
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_COMMIT" ]]
          [[ "$(git cat-file -t "refs/tags/$VERSION")" == tag ]]
          go test -count=1 -race ./...
          go vet ./...
      - name: Build twice and verify deterministic bytes
        run: |
          set -euo pipefail
          mkdir -p dist
          go run ./cmd/releasepack --version "$VERSION" --out dist/release-a
          go run ./cmd/releasepack --version "$VERSION" --out dist/release-b
          diff -r dist/release-a dist/release-b
          go run ./cmd/releasepack --version "$VERSION" --verify dist/release-a
      - name: Upload draft, verify downloaded bytes, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # create fails if a release already exists; never replace existing bytes.
          gh release create "$VERSION" dist/release-a/*.tar.gz dist/release-a/SHA256SUMS dist/release-a/install.sh \
            --repo "$REPO" --draft --verify-tag --generate-notes --title "Mac Cleanup Studio $VERSION"
          gh release download "$VERSION" --repo "$REPO" --dir dist/downloaded
          diff -r dist/release-a dist/downloaded
          go run ./cmd/releasepack --version "$VERSION" --verify dist/downloaded
          gh release edit "$VERSION" --repo "$REPO" --draft=false

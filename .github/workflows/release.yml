name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish macOS binaries
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Validate release tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi

      - name: Test
        run: go test -race ./...

      - name: Build archives and checksums
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist
          build_date="$(git show -s --format=%cI "$GITHUB_SHA")"
          for arch in arm64 amd64; do
            archive="oli-${GITHUB_REF_NAME}-darwin-${arch}"
            mkdir -p "dist/${archive}"
            GOOS=darwin GOARCH="${arch}" go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME} -X main.commit=${GITHUB_SHA} -X main.buildDate=${build_date}" \
              -o "dist/${archive}/oli" ./cmd/oli
            tar -C dist -czf "dist/${archive}.tar.gz" "${archive}"
            rm -r "dist/${archive}"
          done
          cd dist
          shasum -a 256 ./*.tar.gz > SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS
          --verify-tag
          --generate-notes
          --title "Oli ${GITHUB_REF_NAME}"
